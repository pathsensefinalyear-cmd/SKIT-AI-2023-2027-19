
name: Weekly Progress Report

on:
  workflow_dispatch:
  schedule:
    - cron: "29 18 * * 4"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install reportlab matplotlib

      - name: Generate weekly PDF
        run: python "generate_report (2).py" weekly

      - name: Save PDF
        run: |
          mkdir -p weekly_reports
          find . -maxdepth 1 -type f \
            -name '*_Weekly_Progress_Report_Form-3_*.pdf' \
            -exec mv {} weekly_reports/ \;

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/
          if ! git diff --cached --quiet; then
            git commit -m "Add weekly progress report"
            git push
          else
            echo "No report file to commit"
            exit 1
          fi
